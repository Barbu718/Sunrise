name: Build Sunrise PR32

on:
  push:
    branches: [build-pr32]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup CMake 3.31
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.0"

      - name: Configure
        shell: pwsh
        run: cmake -S . -B out/build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build out/build --config Release --target steam_api64

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-PR32-steam_api64
          path: build/x64/Release/steam_api64.dll
          if-no-files-found: error
