name: Build Sunrise PR32

on:
  push:
    branches: [build-pr32]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: msbuild Sunrise.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Verify DLL
        shell: pwsh
        run: |
          Get-Item build/x64/Release/steam_api64.dll

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-PR32-steam_api64
          path: build/x64/Release/steam_api64.dll
          if-no-files-found: error
